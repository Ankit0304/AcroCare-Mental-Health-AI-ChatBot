{% extends 'base.html' %}
{% block title %}Password Updated — ACROCARE{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-5rem)] flex items-center justify-center bg-slate-50/70 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 sm:p-10 text-center">
    
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 mb-4 shadow-sm">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>

    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Password Changed Successfully</h1>
    
    <p class="text-sm sm:text-base text-slate-600 mt-2.5 leading-relaxed">
      Your password has been updated. You can continue using ACROCARE securely.
    </p>

    <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-center gap-4">
      <a href="{% url 'dashboard' %}" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-2xl shadow-md transition">
        Go to Dashboard
      </a>
      <a href="{% url 'profile' %}" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-2xl transition">
        View Profile
      </a>
    </div>

  </div>
</div>
{% endblock %}
